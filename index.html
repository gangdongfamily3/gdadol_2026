 $("prev").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar()};
 $("next").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar()};
 $("today").onclick=()=>{month=new Date();selected=new Date();renderCalendar();renderTasks()};
 $("addEvent").onclick=addEvent;
 $("eventInput").onkeydown=e=>{if(e.key==="Enter")addEvent()};
 renderCalendar();renderTasks();show(active);
}
function renderTasks(){
 const key="gd-tasks-"+dateKey(new Date()),checked=getData(key,[]);
 $("tasks").innerHTML=TASKS.map((t,i)=>`<label><input type="checkbox" data-task="${i}" ${checked.includes(i)?"checked":""}>${esc(t)}</label>`).join("");
 $("tasks").querySelectorAll("input").forEach(el=>el.onchange=()=>{
  saveData(key,[...$("tasks").querySelectorAll("input:checked")].map(e=>Number(e.dataset.task)));
 });
}
function renderCalendar(){
 $("monthTitle").textContent=`${month.getFullYear()}년 ${month.getMonth()+1}월`;
 const year=month.getFullYear(),m=month.getMonth(),start=new Date(year,m,1).getDay(),end=new Date(year,m+1,0).getDate();
 const events=getData("gd-events",{});
 let out=["일","월","화","수","목","금","토"].map(d=>`<div class="dayname">${d}</div>`).join("");
 for(let i=0;i<start;i++)out+='<div></div>';
 for(let day=1;day<=end;day++){
  const d=new Date(year,m,day),key=dateKey(d);
  out+=`<button class="day ${key===dateKey(new Date())?"today":""} ${key===dateKey(selected)?"selected":""}" data-date="${key}">${day}${(events[key]||[]).length?'<span class="dot"></span>':""}</button>`;
 }
 $("calendar").innerHTML=out;
 document.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{
  const [y,m,d]=b.dataset.date.split("-").map(Number);selected=new Date(y,m-1,d);renderCalendar();
 });
 renderEvents();
}
function renderEvents(){
 const key=dateKey(selected),events=getData("gd-events",{});
 $("selectedTitle").textContent=`📌 ${key} 일정`;
 $("eventList").innerHTML=(events[key]||[]).length?(events[key]||[]).map((s,i)=>`<div class="event"><span>${esc(s)}</span><button data-remove="${i}">삭제</button></div>`).join(""):'<p class="muted">등록된 일정이 없습니다.</p>';
 $("eventList").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{
  const all=getData("gd-events",{});all[key].splice(Number(b.dataset.remove),1);saveData("gd-events",all);renderCalendar();
 });
}
function addEvent(){
 const val=$("eventInput").value.trim();if(!val)return;
 const all=getData("gd-events",{}),key=dateKey(selected);(all[key]??=[]).push(val);
 saveData("gd-events",all);$("eventInput").value="";renderCalendar();
}
function search(){
 const q=$("search").value.trim().toLowerCase();
 if(!q){$("results").style.display="none";$("pages").style.display="block";return}
 $("results").style.display="block";$("pages").style.display="none";
 const hits=[];
 MANUAL.forEach(section=>{
  if(section.title.toLowerCase().includes(q))hits.push({id:section.id,title:section.title,sub:"메뉴"});
  section.items.forEach((item,i)=>{
   if((item.title+" "+item.body).toLowerCase().includes(q))hits.push({id:section.id,title:item.title,sub:section.title,index:i});
  });
 });
 $("hits").innerHTML=hits.length?hits.map((h,i)=>`<button class="hit" data-hit="${i}"><strong>${esc(h.title)}</strong><br><span class="muted">${esc(h.sub)}</span></button>`).join(""):'<p>검색 결과가 없습니다.</p>';
 document.querySelectorAll("[data-hit]").forEach(b=>b.onclick=()=>{
  const h=hits[Number(b.dataset.hit)];$("search").value="";show(h.id);
  if(h.index!==undefined){const d=$("page-"+h.id).querySelectorAll("details")[h.index];if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"})}}
 });
}
$("search").addEventListener("input",search);
$("menuToggle").onclick=()=>$("sidebar").classList.toggle("open");
$("quickToggle").onclick=()=>$("quickMenu").classList.toggle("open");
document.addEventListener("click",e=>{if(!e.target.closest(".quick"))$("quickMenu").classList.remove("open")});
renderPages();
</script>
</body>
</html>
